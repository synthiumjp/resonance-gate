[project]
name = "rg-memory"
version = "0.1.0"
description = "LLM-free MCP memory server over the rg-1.1 VSA substrate — explicit structured facts, honest no-match, surfaced conflicts"
requires-python = ">=3.10"
# The rg substrate itself is numpy-only and is loaded from the repo checkout
# at runtime (RG_ROOT); these are the server + registry-encoder deps. There is
# NO generative model dependency — sentence-transformers is the registry's
# non-generative string->vector encoder.
dependencies = [
    "mcp>=1.0",
    "numpy",
    "sentence-transformers",
    "torch",
]

[project.scripts]
rg-memory = "rg_memory.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rg_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
