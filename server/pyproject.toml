[project]
name = "sourcedrecall"
version = "0.5.2"
description = "Memory for AI agents that never calls a language model to store anything: your own dated messages, chosen and labelled by a grammar parser. MCP server and command line."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Jon-Paul Cacioli" }]
# The rg substrate itself is numpy-only and is loaded from the repo checkout
# at runtime (RG_ROOT); these are the server + registry-encoder deps. There is
# NO generative model dependency — sentence-transformers is the registry's
# non-generative string->vector encoder.
# 2026-10-02 (new-user install test): stanza was missing -- profile_ingest
# needs it for the deterministic parser -- and mcp was unpinned, so pip took
# mcp 2.x, which no longer has mcp.server.fastmcp, and the server would not
# start. Install CPU torch first (see README) or pip pulls ~4 GB of CUDA
# wheels this server never uses.
dependencies = [
    "mcp>=1.0,<2",
    "numpy",
    "onnxruntime>=1.17",    # embedder, re-ranker, conflict checker
    "onnx>=1.15",
    "tokenizers>=0.15",
    "huggingface_hub",
    "nltk>=3.8",
]

[project.optional-dependencies]
# 2026-10-05: the parser runs on ONNX Runtime (stanza_ort) with models setup
# downloads; Stanza with PyTorch is the fallback and the reference.
stanza = [
    "torch",
    "stanza==1.14.0",       # pinned: the rgx rules are tuned and tested on this release; 1.15 parses "due to" and some fragments differently
]

[project.scripts]
sourcedrecall = "sourcedrecall.mcp_server:main"
sourcedrecall-setup = "sourcedrecall.setup_models:main"
sourcedrecall-hook = "sourcedrecall.claude_hooks:main"
sourcedrecall-memory = "sourcedrecall.memory_cli:main"
sourcedrecall-import = "sourcedrecall.importers:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcedrecall"]
# the memory code copied in by tools/build_wheel.py (git-ignored)
artifacts = ["sourcedrecall/_core/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
