[project]
name = "rg"
version = "0.1.0"
description = "Resonance Gate: VSA memory substrate where retrieval and confidence are the same operation"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
# the substrate itself stays numpy-only; these extras are for encoder/ and mouth/
encoder = ["sentence-transformers", "torch"]
mouth = ["llama-cpp-python"]

[tool.pytest.ini_options]
testpaths = ["substrate", "gate", "encoder", "mouth", "instruments"]
