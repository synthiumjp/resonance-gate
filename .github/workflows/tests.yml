# The test suite on every push and pull request (review 2026-10-12, 4.4).
# Linux and macOS run everything, with the models setup downloads (parser,
# embedder, re-ranker, conflict checker, WordNet) cached between runs;
# Windows runs the install and the tests that need no models (the store
# lock, the credential filter, the MCP tool list). Actions are pinned to
# commits.
name: tests
on:
  push:
    branches: [product-p2, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e server pytest requests openai tenacity python-dotenv   # the judge-cache tests (a research tool, halumem_official/llms.py)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.sourcedrecall/parser-models
            ~/.cache/sourcedrecall
            ~/nltk_data
          key: models-${{ runner.os }}-${{ hashFiles('server/sourcedrecall/setup_models.py', 'experiments/p2/ort_models.py') }}
      - run: sourcedrecall-setup
      # rgx's own tests find the parser through RGX_PARSER_MODELS, which the
      # server sets for itself
      - run: RGX_PARSER_MODELS=$HOME/.sourcedrecall/parser-models python -m pytest -q rgx experiments/p2 tools server
        env:
          PYTHONPATH: server
          HF_HUB_OFFLINE: "1"
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e server pytest
      - run: python -m pytest -q server/tests/test_lock_windows.py server/tests/test_secrets.py server/tests/test_mcp_annotations.py
        env:
          PYTHONPATH: server
