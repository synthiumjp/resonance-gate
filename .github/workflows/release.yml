# Publish the self-contained wheel to PyPI when a release tag is pushed
# (sourcedrecall-v*). Uses PyPI Trusted Publishing: no token is stored
# anywhere. One-time setup on pypi.org (project "sourcedrecall"): add a
# trusted publisher for this repository, workflow "release.yml",
# environment "pypi". Until then this workflow fails at the upload step and
# publishes nothing.
name: release
on:
  push:
    tags: ["sourcedrecall-v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build
      - name: version in the tag matches the package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' server/pyproject.toml)
          test "sourcedrecall-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject has $v"; exit 1; }
      - run: python tools/build_wheel.py
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: server/dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
